name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked test dependencies
        run: uv sync --locked --group dev

      - name: Run test suite
        run: uv run pytest

      - name: Set up Node.js for WebUI tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run WebUI API tests
        run: node --test tests/*.test.mjs
