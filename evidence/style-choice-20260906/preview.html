<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画風選択の表示確認（模擬データ）</title>
<link rel="stylesheet" href="../../web/style.css">
<main style="max-width: 48rem; margin: auto; padding: 1rem">
  <h1>画風選択の表示確認</h1>
  <p>模擬データを使用。画像解析・GPU学習・本番への保存は行いません。</p>
  <button id="training">学習時の表示</button>
  <button id="sheet">設定画での表示</button>
  <div id="editor"></div>
  <p id="receipt" role="status"></p>
</main>
<div id="notice" aria-live="polite"></div>
<script type="module">
import { API } from '../../web/api.js?v=studio-2';
import { commentEditor } from '../../web/intent.js?v=studio-2';
const output = document.querySelector('#editor');
const receipt = document.querySelector('#receipt');
let dispose = () => {};
async function show(stage) {
  dispose(); output.replaceChildren(); receipt.textContent = '';
  let job = {job_id:'style-display-fixture',status:'awaiting_confirmation',stage,panel:'',original_comment:'画風と衣装への希望',references:[],
    existing_settings:{style:'線画'},available_styles:[{name:'水彩',lora_name:'fixture.safetensors'}],
    proposal:{observations:[],questions:[],changes:[
      {feature:'style',scope:'persistent',panel_key:null,reference:null,description_en:'',avoid_en:'',avoid_ja:'',reason_ja:'参考画像の画風を使いたい',style_name:null,style_deferred:false},
      {feature:'outfit',scope:'persistent',panel_key:null,reference:null,description_en:'blue coat',avoid_en:'',avoid_ja:'',reason_ja:'青いコートを使いたい'}]}};
  if (stage === 'training') {
    job.references = [0,1,2].map(sample_index => ({record_key:'fixture',sample_index,path:`sample-${sample_index}.png`}));
    job.proposal.training_samples = job.references.map((reference,i) => ({reference,priority:['reference','normal','primary'][i],features:[['pose','outfit','style'][i]],reason_ja:['構図の参考だけに使います','衣装を学びます','この画像の画風を優先します'][i]}));
  }
  const accept = proposal => {
    const style = proposal.changes.find(c => c.feature === 'style');
    receipt.textContent = stage === 'training' ? '確認結果：画像1は構図の参考だけ、画像2を通常の教材、画像3を優先する教材として学習開始。' : style.style_deferred ? '確認結果：画風設定は線画のまま。青いコートの希望を採用。' : `確認結果：画風は${style.style_name || '追加なし'}。青いコートの希望を採用。`;
    job = {...job,status:'confirmed',accepted:proposal}; return job;
  };
  API.commentIntents = async () => [job];
  API.confirmComment = async (_id, proposal) => accept(proposal);
  const editor = await commentEditor(output,{name:'表示確認',kind:'character',stage,
    ...(stage === 'training' ? {learningJob:job,onLearningConfirm:async proposal => accept(proposal)} : {})});
  dispose = editor.dispose;
}
document.querySelector('#training').onclick = () => show('training');
document.querySelector('#sheet').onclick = () => show('sheet');
await show('training');
</script>
</html>
